site_name: phdcode
site_description: A literature RAG tool for arXiv, PubMed and OpenAlex, served to any agent harness over MCP.
site_url: https://phdcode.fuminaba.com
repo_url: https://github.com/fuminaba/phdcode
repo_name: fuminaba/phdcode
copyright: Copyright &copy; 2026 Fumi Inaba

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

# STATUS.md holds the work in progress, not documentation; archive/ and
# MODEL_BENCHMARK.md belong to the old general assistant (ADR-0015).
exclude_docs: |
  STATUS.md
  MODEL_BENCHMARK.md
  archive/

plugins:
  - search
  # The reference pages are generated from the docstrings, which the agent
  # also reads: a hand-written copy would drift from the code.
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Using phdcode: using.md
  - Configuration: configuration.md
  - Glossary: GLOSSARY.md
  - Reference:
      - MCP tools: reference/tools.md
      - The phdcode command: reference/cli.md
  # adr/README.md links each ADR, so the nav does not list them again.
  - Decisions: adr/README.md
