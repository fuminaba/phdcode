[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MIL-Instance-Scoring"
version = "0.0.0"
description = "Analysis code for Instance Attention is Misleading: Bag Composition Affects Interpretability in Digital Pathology Multiple Instance Learning"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv",
    "tiffslide>=3.0.0",
    "tifffile==2026.4.11",
    "numpy==2.4.4",
    "zarr==3.1.6",
    "pyvips[binary]",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "polars==1.42.1",
    "scikit-learn==1.9.0",
    "scikit-image==0.26.0",
    "scipy==1.18.0",
    "monai==1.5.2",
    "opencv-python-headless==4.13.0.92",
    "openslide-bin==4.0.1.2",
    "openslide-python==1.4.6",
    "seaborn==0.13.2",
    "shapely==2.1.2",
    "napari>=0.7.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "daphne==4.2.3",
    "openai==1.109.1",
    "python-telegram-bot==22.8",
    "tavily-python==0.8.0",
    "asyncpg==0.31.0",
    "pgvector==0.4.2",
    "marker-pdf[all]==1.10.2",
    "celery==5.6.3",
    "redis==8.1.0",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2"
]

[project.optional-dependencies]
monaiext = ["monai[all]"]

# ==============================================================================
# --- UV CROSS-PLATFORM INDEX CONFIG ---
# ==============================================================================

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'"
]

# --- 1. Define all indices using the standard [[tool.uv.index]] schema ---

# PyTorch's real wheel indices (PEP 503 style), split by CUDA/CPU build
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- 2. Map dependencies to indices via markers ---

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]