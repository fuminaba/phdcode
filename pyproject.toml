[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phdcode"
version = "0.1.0"
description = "A literature RAG tool for arXiv, PubMed and OpenAlex, served to any agent harness over MCP."
readme = "README.md"
requires-python = ">=3.12"

# Every entry below is imported somewhere in this repository. Transitive
# dependencies are deliberately NOT restated -- numpy, scipy, scikit-learn,
# opencv and Pillow all arrive via marker-pdf and transformers, and pinning
# them here again only creates resolution conflicts to maintain.
dependencies = [
    "python-dotenv",

    # --- Knowledge store: Postgres + pgvector -------------------------------
    "asyncpg==0.31.0",
    "pgvector==0.4.2",

    # --- Model access ------------------------------------------------------
    # OpenAI-compatible client, used against Ollama and llama-server rather
    # than against OpenAI itself. generation.generate() resolves its client
    # through routes.py; embeddings.embed() calls Ollama's native API.
    "openai==1.109.1",

    # --- Local inference ---------------------------------------------------
    # torch and torchvision are pinned for marker-pdf (document extraction),
    # so that the CUDA build matches the index below.
    "torch==2.13.0",
    "torchvision==0.28.0",

    # --- Document ingestion ------------------------------------------------
    # The text-mode parse (documents.py: no OCR, on the CPU). The balanced
    # mode uses the Surya server of marker 2.x instead (ADR-0017).
    "marker-pdf[all]==1.10.2",
    "polars==1.42.1",

    # --- External connectors -----------------------------------------------
    "requests",
    "pydantic",

    # --- Interface: the MCP server (ADR-0016) ------------------------------
    # 2.x renamed FastMCP to MCPServer (mcp.server.mcpserver).
    "mcp==2.3.0",
]

[project.scripts]
phdcode-mcp = "llm_engine.mcp_server:main"

[tool.setuptools.packages.find]
include = ["llm_engine*"]

# ==============================================================================
# --- UV CROSS-PLATFORM INDEX CONFIG ---
# ==============================================================================

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'"
]

# PyTorch's real wheel indices (PEP 503 style), split by CUDA/CPU build
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
