{% extends "base.html" %}
{% block title %}How it works · phdcode{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
{% endblock %}
{% block main %}
<div class="md">{{ html|safe }}</div>
<script>
// The page is docs/how-it-works.md: each ```mermaid block becomes a diagram.
document.querySelectorAll("pre > code.language-mermaid").forEach(code => {
  const diagram = document.createElement("div");
  diagram.className = "mermaid";
  diagram.textContent = code.textContent;
  code.parentElement.replaceWith(diagram);
});
mermaid.initialize({ startOnLoad: false, theme: "neutral", flowchart: { useMaxWidth: true } });
mermaid.run();
</script>
{% endblock %}
